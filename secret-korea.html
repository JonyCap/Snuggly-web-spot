<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Korea 🔐 – Dong-A University Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap');

  :root {
    --bg: #07080f;
    --bg2: #0d0f1c;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --border-glow: rgba(108,99,255,0.5);
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --gold: #f7c948;
    --text: #e8e8f0;
    --muted: rgba(232,232,240,0.45);
    --card-r: 20px;
    --blob1: #6c63ff33;
    --blob2: #ff658422;
    --blob3: #43e97b18;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
  }

  /* ── BLOBS ── */
  .bg-blobs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px);
    animation: blobDrift 18s ease-in-out infinite alternate;
  }
  .blob-1 { width: 520px; height: 520px; background: var(--blob1); top: -120px; left: -100px; animation-delay: 0s; }
  .blob-2 { width: 400px; height: 400px; background: var(--blob2); bottom: 10%; right: -80px; animation-delay: -6s; }
  .blob-3 { width: 300px; height: 300px; background: var(--blob3); top: 50%; left: 40%; animation-delay: -12s; }

  @keyframes blobDrift {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(30px,-40px) scale(1.08); }
    100% { transform: translate(-20px,30px) scale(0.95); }
  }

  /* ── GRAIN OVERLAY ── */
  body::after {
    content:''; position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    opacity: 0.35;
  }

  /* ── LAYOUT ── */
  .wrapper { position: relative; z-index: 2; max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  /* ── HEADER ── */
  header {
    padding: 80px 0 60px;
    text-align: center;
    position: relative;
  }

  .header-tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(108,99,255,0.12); border: 1px solid rgba(108,99,255,0.3);
    border-radius: 100px; padding: 6px 16px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    color: #a09bff; margin-bottom: 28px;
    animation: fadeUp 0.6s ease both;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  h1 .lock-char {
    display: inline-block;
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 24px rgba(108,99,255,0.7));
  }

  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: var(--muted);
    margin-top: 16px;
    font-weight: 300;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .subtitle .campus {
    color: var(--accent3);
    font-weight: 500;
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
    margin: 48px 0 64px;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px; border-radius: 100px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
    border: none; cursor: pointer; transition: all 0.25s cubic-bezier(.4,0,.2,1);
    position: relative; overflow: hidden; text-decoration: none;
  }

  .btn::before {
    content:''; position:absolute; inset:0; border-radius:inherit;
    background: rgba(255,255,255,0.12);
    opacity: 0; transition: opacity 0.2s;
  }
  .btn:hover::before { opacity: 1; }

  .btn-primary {
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    color: #fff;
    box-shadow: 0 0 30px rgba(108,99,255,0.35), 0 4px 20px rgba(108,99,255,0.2);
  }
  .btn-primary:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 50px rgba(108,99,255,0.55), 0 8px 30px rgba(108,99,255,0.3);
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  .btn-secondary:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.2);
    background: var(--surface-hover);
  }

  .btn-ghost {
    background: transparent;
    color: var(--gold);
    border: 1px solid rgba(247,201,72,0.3);
  }
  .btn-ghost:hover {
    background: rgba(247,201,72,0.08);
    border-color: rgba(247,201,72,0.6);
    transform: translateY(-2px);
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;
    margin-bottom: 56px;
    animation: fadeUp 0.6s 0.35s ease both;
  }
  .stat { text-align: center; }
  .stat-num { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 22px;
    animation: fadeUp 0.6s 0.45s ease both;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-r);
    padding: 28px;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1),
                box-shadow 0.3s cubic-bezier(.4,0,.2,1),
                border-color 0.3s;
    cursor: default;
  }

  .card::before {
    content:'';
    position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg, rgba(108,99,255,0.06), transparent 60%);
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(108,99,255,0.35);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(108,99,255,0.12);
  }
  .card:hover::before { opacity: 1; }

  .card.highlighted {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 60px rgba(108,99,255,0.3), 0 20px 60px rgba(0,0,0,0.5);
    animation: pulse-card 1.8s ease infinite;
  }

  @keyframes pulse-card {
    0%,100% { box-shadow: 0 0 0 1px var(--accent), 0 0 40px rgba(108,99,255,0.3), 0 20px 60px rgba(0,0,0,0.5); }
    50%      { box-shadow: 0 0 0 2px var(--accent), 0 0 70px rgba(108,99,255,0.5), 0 20px 60px rgba(0,0,0,0.5); }
  }

  /* locked */
  .card.locked .card-body { filter: blur(5px); user-select: none; }
  .card.locked {
    cursor: pointer;
    border-color: rgba(255,255,255,0.12);
  }
  .card.locked:hover { border-color: rgba(247,201,72,0.5); }

  .lock-overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; border-radius: var(--card-r);
    background: rgba(7,8,15,0.4); backdrop-filter: blur(2px);
    transition: opacity 0.3s;
  }
  .card:not(.locked) .lock-overlay { opacity: 0; pointer-events: none; }

  .lock-icon {
    font-size: 2.2rem;
    filter: drop-shadow(0 0 12px rgba(247,201,72,0.7));
    animation: lockBounce 2.5s ease infinite;
  }
  @keyframes lockBounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .lock-hint {
    font-size: 12px; color: var(--gold); font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
  }

  /* unlock animation */
  @keyframes unlockFlash {
    0%   { box-shadow: 0 0 0 rgba(67,233,123,0); background: var(--surface); }
    30%  { box-shadow: 0 0 60px rgba(67,233,123,0.4); background: rgba(67,233,123,0.06); }
    100% { box-shadow: 0 0 0 rgba(67,233,123,0); background: var(--surface); }
  }
  .card.unlocking { animation: unlockFlash 0.7s ease forwards; }

  /* ── CARD INTERNALS ── */
  .card-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 16px;
  }

  .category-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px; padding: 5px 12px;
    font-size: 12px; font-weight: 500; color: var(--muted);
  }

  .heart-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.3rem; transition: transform 0.2s;
    line-height: 1; padding: 2px;
    filter: grayscale(1) brightness(0.7);
  }
  .heart-btn.loved {
    filter: none;
    animation: heartPop 0.3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes heartPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.5); }
    100% { transform: scale(1); }
  }
  .heart-btn:hover { transform: scale(1.2); }

  .card-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 8px; line-height: 1.2;
  }

  .card-desc {
    font-size: 14px; line-height: 1.65; color: var(--muted);
    margin-bottom: 18px;
  }

  .meta-row {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  }

  .meta-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 100px; padding: 4px 10px;
    font-size: 12px; color: var(--muted);
  }

  .price-pill { color: var(--accent3); border-color: rgba(67,233,123,0.2); background: rgba(67,233,123,0.06); }
  .time-pill  { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }

  .tip-box {
    background: rgba(247,201,72,0.06); border: 1px solid rgba(247,201,72,0.15);
    border-radius: 10px; padding: 10px 14px;
    font-size: 13px; color: rgba(247,201,72,0.85);
    margin-bottom: 18px;
  }
  .tip-box::before { content: '💡 '; }

  .card-actions {
    display: flex; gap: 10px; flex-wrap: wrap;
  }

  .btn-map {
    flex: 1; min-width: 120px;
    background: rgba(108,99,255,0.12);
    border: 1px solid rgba(108,99,255,0.25);
    color: #a09bff;
    border-radius: 100px; padding: 10px 16px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; transition: all 0.2s;
  }
  .btn-map:hover {
    background: rgba(108,99,255,0.22);
    border-color: rgba(108,99,255,0.5);
    transform: translateY(-1px);
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 100px; padding: 48px 0;
    text-align: center;
    border-top: 1px solid var(--border);
    position: relative; z-index: 2;
  }
  .footer-text { font-size: 14px; color: var(--muted); }
  .footer-text strong { color: var(--text); font-weight: 500; }

  .footer-glow {
    display: inline-block; margin-top: 8px;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(108,99,255,0.6);
  }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #fff;
    padding: 12px 24px; border-radius: 100px;
    font-size: 14px; font-weight: 500;
    opacity: 0; transition: all 0.3s; z-index: 999;
    pointer-events: none;
    box-shadow: 0 8px 30px rgba(108,99,255,0.4);
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 60px 0 40px; }
    .stats-bar { gap: 24px; }
    .grid { grid-template-columns: 1fr; }
    .controls { flex-direction: column; align-items: center; }
    .btn { width: 100%; max-width: 320px; justify-content: center; }
  }

  /* Scroll-in animation for cards */
  .card { opacity: 0; transform: translateY(30px); }
  .card.visible { animation: fadeUp 0.5s ease forwards; }
  .card:nth-child(1).visible { animation-delay: 0.05s; }
  .card:nth-child(2).visible { animation-delay: 0.10s; }
  .card:nth-child(3).visible { animation-delay: 0.15s; }
  .card:nth-child(4).visible { animation-delay: 0.20s; }
  .card:nth-child(5).visible { animation-delay: 0.25s; }
  .card:nth-child(6).visible { animation-delay: 0.30s; }
  .card:nth-child(7).visible { animation-delay: 0.35s; }

</style>
</head>
<body>

<!-- Background blobs -->
<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="header-tag">🇰🇷 Busan · Dong-A University · Bumin Campus</div>
    <h1>Secret <span class="lock-char">Korea</span> 🔐</h1>
    <p class="subtitle">Hidden gems curated by locals, for exchange students at <span class="campus">Dong-A University</span></p>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn btn-primary" onclick="randomSecret()">🎲 Random Secret</button>
    <button class="btn btn-secondary" onclick="unlockAll()">🔓 Unlock All</button>
    <button class="btn btn-ghost" onclick="showFavorites()">⭐ Favorites <span id="fav-count"></span></button>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat"><div class="stat-num" id="stat-total">7</div><div class="stat-label">Hidden Gems</div></div>
    <div class="stat"><div class="stat-num" id="stat-unlocked">0</div><div class="stat-label">Unlocked</div></div>
    <div class="stat"><div class="stat-num" id="stat-favorites">0</div><div class="stat-label">Saved</div></div>
  </div>

  <!-- CARDS GRID -->
  <main class="grid" id="grid"></main>

  <!-- FOOTER -->
  <footer>
    <p class="footer-text">Made with ❤️ for <strong>exchange students in Busan 🇰🇷</strong></p>
    <span class="footer-glow">Secret Korea · Dong-A University Edition · 동아대학교</span>
  </footer>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  const PLACES = [
    {
      id: 1,
      name: "Cheongchun Bulgogi",
      nameKr: "청춘불고기",
      category: "🍽️ Meal",
      price: "₩8,000 – ₩12,000",
      time: "Lunch",
      desc: "A cozy local restaurant where students enjoy authentic Korean bulgogi at affordable prices. Generous portions and delicious side dishes make it perfect for a first-time Korean food experience.",
      tip: "Order the lunch set for best value",
      map: "https://map.kakao.com/link/search/청춘불고기%20부산",
      locked: false
    },
    {
      id: 2,
      name: "Jomojomo Cake Café",
      nameKr: "조모조모",
      category: "🍰 Dessert",
      price: "₩5,000 – ₩9,000",
      time: "Afternoon",
      desc: "A hidden aesthetic café with soft lighting and beautifully crafted cakes. Perfect for relaxing or taking photos that'll make your Instagram pop.",
      tip: "Try the cream cake + coffee combo",
      map: "https://map.kakao.com/link/search/Jomojomo%20Busan",
      locked: true
    },
    {
      id: 3,
      name: "Yeogsimi Tongdak",
      nameKr: "역시미통닭",
      category: "🍗 Fried Chicken",
      price: "₩10,000 – ₩18,000",
      time: "Night",
      desc: "Classic Korean fried chicken at a student-friendly price. Crispy, juicy, and absolutely perfect for late-night hangouts with your squad.",
      tip: "Best shared with friends — order two flavours",
      map: "https://map.kakao.com/link/search/역시미통닭%20부산",
      locked: true
    },
    {
      id: 4,
      name: "Hada Café",
      nameKr: "하다카페",
      category: "☕ Café",
      price: "₩4,500 – ₩7,000",
      time: "Morning",
      desc: "A peaceful hidden café ideal for studying or relaxing far from campus noise. Natural light, good vibes, and even better coffee.",
      tip: "Bring a laptop or book — you'll lose track of time",
      map: "https://map.kakao.com/link/search/하다카페%20부산",
      locked: false
    },
    {
      id: 5,
      name: "School Pizza",
      nameKr: "스쿨피자",
      category: "🍕 Pizza",
      price: "₩9,000 – ₩15,000",
      time: "Lunch / Group",
      desc: "A great spot to enjoy quality pizza when you're craving something different from Korean food. Western comfort, Korean prices.",
      tip: "Share a large pizza — great value for groups",
      map: "https://map.kakao.com/link/search/School%20Pizza%20Busan",
      locked: true
    },
    {
      id: 6,
      name: "Juicy Smoothie",
      nameKr: "쥬시",
      category: "🥤 Drinks",
      price: "₩3,500 – ₩6,000",
      time: "Afternoon",
      desc: "Fresh smoothies and cold-pressed juices — perfect for hot Busan days or a post-class energy boost. Light, refreshing, and dangerously good.",
      tip: "Try mango or strawberry — you won't regret it",
      map: "https://map.kakao.com/link/search/Juicy%20Busan",
      locked: false
    },
    {
      id: 7,
      name: "Dong-A Cafeteria",
      nameKr: "동아대 학식",
      category: "🍱 Campus Meal",
      price: "~₩7,000",
      time: "Lunch",
      desc: "The ultimate student hack — cheap, filling, and a different Korean meal every day. Experience authentic student life and eat like a local.",
      tip: "Go early to avoid long queues — it fills up fast",
      map: "https://map.kakao.com/link/search/동아대학교%20부민캠퍼스",
      locked: false
    },
  ];

  let unlocked = new Set();
  let favorites = new Set();

  function loadState() {
    try {
      const u = localStorage.getItem('sk_unlocked');
      const f = localStorage.getItem('sk_favorites');
      if (u) unlocked = new Set(JSON.parse(u));
      if (f) favorites = new Set(JSON.parse(f));
    } catch(e) {}
  }

  function saveState() {
    try {
      localStorage.setItem('sk_unlocked', JSON.stringify([...unlocked]));
      localStorage.setItem('sk_favorites', JSON.stringify([...favorites]));
    } catch(e) {}
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function updateStats() {
    const total = PLACES.length;
    const un = PLACES.filter(p => !p.locked || unlocked.has(p.id)).length;
    const fav = favorites.size;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-unlocked').textContent = un;
    document.getElementById('stat-favorites').textContent = fav;
    const fc = document.getElementById('fav-count');
    fc.textContent = fav > 0 ? `(${fav})` : '';
  }

  function isLocked(place) {
    return place.locked && !unlocked.has(place.id);
  }

  function renderCards() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    PLACES.forEach(p => {
      const locked = isLocked(p);
      const loved = favorites.has(p.id);

      const card = document.createElement('div');
      card.className = `card${locked ? ' locked' : ''}`;
      card.dataset.id = p.id;

      card.innerHTML = `
        ${locked ? `
        <div class="lock-overlay" onclick="unlockCard(${p.id})">
          <div class="lock-icon">🔒</div>
          <div class="lock-hint">Tap to unlock</div>
        </div>` : ''}
        <div class="card-body">
          <div class="card-header">
            <span class="category-badge">${p.category}</span>
            <button class="heart-btn ${loved ? 'loved' : ''}" 
              onclick="toggleFav(event, ${p.id})" 
              aria-label="Save to favorites">
              ${loved ? '❤️' : '🤍'}
            </button>
          </div>
          <div class="card-name">${p.name} <span style="font-size:0.75em;font-weight:400;color:var(--muted);font-family:'DM Sans',sans-serif;">${p.nameKr}</span></div>
          <div class="card-desc">${p.desc}</div>
          <div class="meta-row">
            <span class="meta-pill price-pill">💰 ${p.price}</span>
            <span class="meta-pill time-pill">🕐 ${p.time}</span>
          </div>
          <div class="tip-box">${p.tip}</div>
          <div class="card-actions">
            <a href="${p.map}" target="_blank" rel="noopener" class="btn-map">
              📍 Open in KakaoMap
            </a>
          </div>
        </div>
      `;

      if (!locked) {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.heart-btn') || e.target.closest('.btn-map')) return;
        });
      }

      grid.appendChild(card);
    });

    // Intersection observer for scroll-in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });

    document.querySelectorAll('.card').forEach(c => observer.observe(c));
    updateStats();
  }

  function unlockCard(id) {
    if (unlocked.has(id)) return;
    unlocked.add(id);
    saveState();

    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) {
      card.classList.add('unlocking');
      card.classList.remove('locked');
      card.querySelector('.lock-overlay')?.remove();
      setTimeout(() => card.classList.remove('unlocking'), 700);
    }
    showToast('🔓 Secret unlocked!');
    updateStats();
  }

  function unlockAll() {
    PLACES.forEach(p => unlocked.add(p.id));
    saveState();
    renderCards();
    showToast('🔓 All secrets revealed!');
  }

  function toggleFav(e, id) {
    e.stopPropagation();
    if (favorites.has(id)) {
      favorites.delete(id);
      showToast('💔 Removed from favorites');
    } else {
      favorites.add(id);
      showToast('❤️ Saved to favorites!');
    }
    saveState();

    const btn = e.currentTarget;
    btn.textContent = favorites.has(id) ? '❤️' : '🤍';
    btn.classList.toggle('loved', favorites.has(id));
    updateStats();
  }

  function randomSecret() {
    const available = PLACES.filter(p => !isLocked(p));
    if (!available.length) { showToast('🔒 Unlock some secrets first!'); return; }
    const pick = available[Math.floor(Math.random() * available.length)];

    document.querySelectorAll('.card').forEach(c => c.classList.remove('highlighted'));
    const target = document.querySelector(`.card[data-id="${pick.id}"]`);
    if (target) {
      target.classList.add('highlighted');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      showToast(`🎲 Today's pick: ${pick.name}!`);
      setTimeout(() => target.classList.remove('highlighted'), 4000);
    }
  }

  function showFavorites() {
    if (favorites.size === 0) { showToast('💔 No favorites yet — start saving!'); return; }
    const names = PLACES.filter(p => favorites.has(p.id)).map(p => p.name).join(', ');
    showToast(`❤️ ${names}`);
  }

  // INIT
  loadState();
  renderCards();
</script>
</body>
</html>
